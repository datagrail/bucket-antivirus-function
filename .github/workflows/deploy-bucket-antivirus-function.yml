name: Deploy bucket-antivirus Lambdas

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions: {}

env:
  AWS_REGION: us-west-2

jobs:
  deploy:
    runs-on: ubuntu-22.04
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix:
        include: 
          - realm: cyera-prod
            account_id: 112875909405
          - realm: cyera-stage
            account_id: 925314695942
          - realm: dg-stage
            account_id: 708380009554

    steps:
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-region: us-west-2
          role-to-assume: arn:aws:iam::${{ matrix.account_id }}:role/GHA-lambda-av-deploy-${{ matrix.realm}}

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Build
        run: make archive 

      - name: Deploy to bucket-antivirus-function Lambda
        run: |
          aws lambda update-function-code \
            --function-name bucket-antivirus-function-${{ matrix.realm }} \
            --zip-file fileb://build/lambda.zip \
            --publish

      - name: Get bucket-antivirus-function Lambda updated info
        run: |
          aws lambda get-function-configuration \
            --function-name bucket-antivirus-function-${{ matrix.realm }} \
            --query '{LastModified: LastModified, Version: Version, CodeSha256: CodeSha256}' \
            --output table

      - name: Deploy to bucket-antivirus-update Lambda
        run: |
          aws lambda update-function-code \
            --function-name bucket-antivirus-update-${{ matrix.realm }} \
            --zip-file fileb://build/lambda.zip \
            --publish

      - name: Get bucket-antivirus-update Lambda updated info
        run: |
          aws lambda get-function-configuration \
            --function-name bucket-antivirus-update-${{ matrix.realm }} \
            --query '{LastModified: LastModified, Version: Version, CodeSha256: CodeSha256}' \
            --output table

  label-deployed-prs:
    needs: deploy
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: datagrail/dg-github-actions/label-deployed-prs@db8934134057f72fc61a9b935ba48e2c9716816f # v1.3.0
        with:
          label: |
            Realm_Cyera_Prod
            Realm_Cyera_Stage
            Realm_Dg_Stage
          environment: cyera-prod, cyera-stage, dg-stage
          ref: ${{ github.sha }}
          # workflow_dispatch can run from any branch; only label deploys of master
          require-default-branch: true
          # Every merge to master deploys here, so a comment would just echo the merge
          comment: false
